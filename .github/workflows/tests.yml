# Core tests on plain .NET. The core has no UnityEngine dependencies, so this needs
# no Unity license. The Unity-only layers are verified in the Editor.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core tests (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet test .ci/CloudSaveKit.Tests.csproj
